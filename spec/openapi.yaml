openapi: 3.0.4
info:
  title: Lineo Finance — Broker Integration API
  version: 1.0.2
  description: |
    API for broker partners to integrate with the Lineo Finance onboarding and
    data-sharing platform.

    The integration covers two independent concerns:

    - **Lead onboarding** — register a new prospective customer who is not yet on Lineo.
    - **Connection establishment** — link an existing Lineo customer to the broker partner
      for ongoing data sharing.

    ## Lead onboarding — POST /v1/broker/leads

    A single endpoint supports two sub-flows, determined by the `has_existing_tax_advisor`
    Boolean field.

    ### Flow A — Customer without existing tax advisor (has_existing_tax_advisor false or omitted)

    1. **Register a lead** — `POST /v1/broker/leads` submits customer data. Lineo internally
       matches a tax advisory partner, generates the service contract PDF, initiates
       Yousign electronic signing and returns `status: "contract_sent"` with a `signature_link`
       for iFrame embedding.
    2. **Customer signs** — The customer reviews and signs the contract inside the iFrame.
       Status transitions to `contract_signed`.
    3. **Partner countersigns** — The matched tax advisor countersigns. Status transitions
       to `active`. Lineo then creates the customer account and sends the activation email
       with a password-set link. **No further API calls are required from the broker.**

    ### Flow B — Customer with existing tax advisor (has_existing_tax_advisor true)

    1. **Register a lead** — `POST /v1/broker/leads` submits customer data + `tax_advisor_contact`
       and returns `status: "awaiting_third_party"`. No signature link is returned.
    2. **Advisor claims the lead** — Lineo contacts the tax advisor via email. Once the
       advisor accepts, the contract is generated with that advisor as partner; status
       transitions to `contract_sent` (signature link becomes available).
    3. **Customer signs → partner countersigns → active** — same as Flow A from this point on.

    ### Auto-provisioned data-sharing connection

    If `external_customer_reference` is supplied at lead registration, Lineo will, upon transition
    to `active`, automatically materialise a data-sharing connection for the resulting
    customer. No separate `POST /v1/broker/connections` call is required for the lead-flow
    case. The `connection.activated` webhook is emitted alongside `lead.status.active`.

    ## Connection establishment for existing customers — POST /v1/broker/connections

    For customers who are **already** Lineo customers (registered manually, via another
    broker partner, or via a previous lead) and now want to connect their broker account
    for data sharing, the broker calls `POST /v1/broker/connections` with the customer's
    Handelsregister identifier (`hrb_court` + `hrb_number`) plus the broker-side customer
    reference. Consent for data sharing is governed by the partnership contract — the
    broker is responsible for capturing and retaining customer consent on their side.

    On success the connection is created in `active` state and the broker receives the
    Lineo `company_id` plus `connection_id`. On HRB lookup miss the broker receives `404`.

    Connections can be queried (`GET`) and revoked (`DELETE`) symmetrically.

    ## Status tracking (both surfaces)

    The broker can poll `GET /v1/broker/leads/{leadId}/status` and
    `GET /v1/broker/connections/{connectionId}` or receive real-time
    **webhook notifications** on state changes.

    ## Authentication

    All endpoints require an `X-Api-Key` header. API keys are provisioned by Lineo
    during partner onboarding.

    ## Webhook Notifications

    If a webhook URL is configured for your broker account, Lineo will POST a signed JSON
    payload to that URL on every lead status transition and connection lifecycle event.
    See the **Webhooks** section below for the payload schema and verification instructions.
  contact:
    name: Lineo Finance Engineering
    email: engineering@lineo.finance

servers:
  - url: https://api.lineo.finance
    description: Production
  - url: https://api.staging.lineo.finance
    description: Staging / Sandbox

security:
  - ApiKey: []

tags:
  - name: Leads
    description: Lead registration and onboarding lifecycle for new prospective customers
  - name: Connections
    description: Data-sharing connection establishment for existing Lineo customers
  - name: Webhooks
    description: Outbound webhook payload schemas (for reference — not callable endpoints)

paths:
  /v1/broker/leads:
    post:
      operationId: registerBrokerLead
      summary: Register a lead and initiate onboarding
      description: |
        Submits customer data and initiates the appropriate onboarding flow based on
        the `has_existing_tax_advisor` field:

        - **`false` (default):** Generates a service contract PDF, initiates Yousign
          electronic signing, and returns a `signature_link` for iFrame embedding.
        - **`true`:** Requires `tax_advisor_contact`. Lineo contacts the tax advisor
          asynchronously. Returns `status: "awaiting_third_party"` with no signature link.

        **Idempotency:** Leads are unique per broker by `(hrb_court, hrb_number)`. If
        an active lead with the same HRB already exists for your broker, the existing
        lead data is returned with `is_existing: true` and HTTP `200 OK` regardless of
        whether other fields (email, representative name, `external_customer_reference`)
        match. To override fields on an existing active lead, contact Lineo support.

        **Conflict (`409`):** Two distinct conflict conditions, checked in order:

        1. **HRB already known to Lineo.** The supplied HRB belongs either to an
           existing Lineo customer (regardless of how that customer entered the system
           — converted from a previous lead, registered manually, or linked via another
           broker) or to an active lead with a different broker. In both cases the
           lead cannot be created. If the company is an active customer, use
           `POST /v1/broker/connections` instead.
        2. **Representative email already a Lineo user.** Only checked if the HRB is
           unknown. The supplied representative email is already bound to an existing
           Lineo `ApplicationUser`. Lead conversion would fail downstream because user
           emails are unique. Contact Lineo support to link the new company to the
           existing user account.
      tags: [Leads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterLeadRequest"
            examples:
              without_tax_advisor:
                summary: Customer without existing tax advisor (default)
                value:
                  external_customer_reference: vivid-2026-01-abc123
                  company_name: Muster GmbH
                  hrb_court: Amtsgericht München
                  hrb_number: HRB 123456
                  street: Teststraße 1
                  postal_code: "10115"
                  city: Berlin
                  first_name: Max
                  last_name: Mustermann
                  email: max.mustermann@example.de
                  phone: "+491701234567"
              with_tax_advisor:
                summary: Customer with existing tax advisor
                value:
                  external_customer_reference: vivid-2026-01-abc123
                  company_name: Muster GmbH
                  hrb_court: Amtsgericht München
                  hrb_number: HRB 123456
                  street: Teststraße 1
                  postal_code: "10115"
                  city: Berlin
                  first_name: Max
                  last_name: Mustermann
                  email: max.mustermann@example.de
                  phone: "+491701234567"
                  has_existing_tax_advisor: true
                  tax_advisor_contact:
                    name: Dr. Schmidt Steuerberatung
                    email: schmidt@steuerberater.de
                    phone: "+491709876543"
      responses:
        "201":
          description: Lead created and onboarding initiated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterLeadResponse"
              examples:
                without_tax_advisor:
                  summary: Response when has_existing_tax_advisor is false
                  value:
                    lead_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    external_customer_reference: vivid-2026-01-abc123
                    status: contract_sent
                    signature_link: https://yousign.app/signatures/ee1d9413-ce72-4c25-a294-fcf20cf34a26
                    signature_link_expiration_date: "2026-05-20T14:30:00Z"
                    is_existing: false
                with_tax_advisor:
                  summary: Response when has_existing_tax_advisor is true
                  value:
                    lead_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    external_customer_reference: vivid-2026-01-abc123
                    status: awaiting_third_party
                    is_existing: false
        "200":
          description: >
            Idempotent hit — an active lead with the same HRB already exists for this
            broker. The existing lead is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterLeadResponse"
              examples:
                without_tax_advisor:
                  summary: Existing lead with valid signature link
                  value:
                    lead_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    external_customer_reference: vivid-2026-01-abc123
                    status: contract_sent
                    signature_link: https://yousign.app/signatures/ee1d9413-ce72-4c25-a294-fcf20cf34a26
                    signature_link_expiration_date: "2026-05-20T14:30:00Z"
                    is_existing: true
                with_tax_advisor:
                  summary: Existing lead awaiting third party
                  value:
                    lead_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    external_customer_reference: vivid-2026-01-abc123
                    status: awaiting_third_party
                    is_existing: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            Conflict. Either the supplied HRB is already known to Lineo (checked
            first), or — only when the HRB is unknown — the supplied representative
            email is already a registered Lineo user. See the endpoint description
            for full semantics and remediation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                hrb_already_known:
                  summary: Company already known to Lineo
                  value:
                    type: https://api.lineo.finance/errors/hrb-already-known
                    title: HRB Already Known
                    status: 409
                    detail: This company is already known to Lineo. If it is an active customer, use POST /v1/broker/connections to establish data sharing.
                email_already_registered:
                  summary: Representative is already a Lineo user
                  value:
                    type: https://api.lineo.finance/errors/email-already-registered
                    title: Email Already Registered
                    status: 409
                    detail: The supplied representative email is already registered as a Lineo user. Please contact Lineo support to link the new company to the existing account.
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/broker/leads/{leadId}/status:
    get:
      operationId: getBrokerLeadStatus
      summary: Query lead status
      description: |
        Returns the current status and key timestamps for a lead owned by the
        authenticated broker.
      tags: [Leads]
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The lead identifier returned by the registration endpoint.
      responses:
        "200":
          description: Lead status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStatusResponse"
              example:
                lead_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                external_customer_reference: vivid-2026-01-abc123
                status: contract_signed
                assigned_partner_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                partner_name: Steuerberatung Schmidt
                created_at: "2026-04-13T10:00:00Z"
                contract_signed_at: "2026-04-13T10:15:00Z"
                activated_at: null
                connection_id: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Lead not found or not owned by the authenticated broker.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.lineo.finance/errors/lead-not-found
                title: Lead Not Found
                status: 404
                detail: The requested lead does not exist or is not owned by your broker account.

  /v1/broker/connections:
    post:
      operationId: createBrokerConnection
      summary: Establish a data-sharing connection with an existing Lineo customer
      description: |
        Creates a data-sharing link between the calling broker and an existing Lineo
        customer identified by Handelsregister (HRB).

        **Use this endpoint when** the customer is already a Lineo customer (registered
        manually, via another broker partner, or via a previous lead that has reached
        `active` state) and now wants to add this broker as a data source.

        **For new customers** that are not yet on Lineo, use `POST /v1/broker/leads`
        instead. If `external_customer_reference` was supplied at lead registration, the
        connection is created automatically when the lead reaches `active` — no separate
        call needed.

        **Idempotency.** A connection is uniquely identified by
        `(broker_partner, external_customer_reference)`. Re-posting with the same
        `external_customer_reference` for the same broker returns `200 OK` with `is_existing: true`
        (the existing connection is returned). Re-posting with a different
        `external_customer_reference` for an HRB that is already connected to this broker returns
        `409 Conflict`.

        **HRB lookup.** If no Lineo company matches the supplied `hrb_court` + `hrb_number`,
        the response is `404`. The broker may then either (a) start the lead-onboarding
        flow via `POST /v1/broker/leads`, or (b) inform the customer that no matching
        Lineo customer was found.
      tags: [Connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionRequest"
            examples:
              standard:
                summary: Connect an existing Lineo customer
                value:
                  external_customer_reference: vivid-2026-01-abc123
                  hrb_court: Amtsgericht München
                  hrb_number: HRB 123456
      responses:
        "201":
          description: Connection created and active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
              example:
                connection_id: 5f9b1e1f-2c08-4f8e-9b3b-1c5e6d7a9b10
                lineo_company_id: 7c8f70f7-1234-5678-9abc-def012345678
                external_customer_reference: vivid-2026-01-abc123
                status: active
                created_at: "2026-04-15T09:30:12Z"
                is_existing: false
        "200":
          description: >
            Idempotent hit — a connection with the same `external_customer_reference` already
            exists for this broker. The existing connection is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
              example:
                connection_id: 5f9b1e1f-2c08-4f8e-9b3b-1c5e6d7a9b10
                lineo_company_id: 7c8f70f7-1234-5678-9abc-def012345678
                external_customer_reference: vivid-2026-01-abc123
                status: active
                created_at: "2026-04-15T09:30:12Z"
                is_existing: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No Lineo customer found for the supplied HRB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.lineo.finance/errors/customer-not-found
                title: Customer Not Found
                status: 404
                detail: No Lineo customer matches the supplied hrb_court and hrb_number.
        "409":
          description: >
            Conflict within the calling broker's own connections. Either the supplied
            HRB is already linked to this broker via a different `external_customer_reference`,
            or the supplied `external_customer_reference` is already linked to a different HRB.

            Note: cross-broker linkage is intentionally **not** a conflict here — a
            single Lineo customer may be connected to multiple broker partners
            simultaneously. The leads-endpoint 409 (which does block cross-broker HRB
            collisions) applies only to onboarding, not to data-sharing connections.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: https://api.lineo.finance/errors/connection-conflict
                title: Connection Conflict
                status: 409
                detail: This customer is already connected to your broker via a different external_customer_reference.
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: >
            Too many requests. See `Retry-After` header for the suggested retry delay.

  /v1/broker/connections/{connectionId}:
    get:
      operationId: getBrokerConnection
      summary: Get connection status
      description: Returns the current state of a connection owned by the authenticated broker.
      tags: [Connections]
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Connection retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
              example:
                connection_id: 5f9b1e1f-2c08-4f8e-9b3b-1c5e6d7a9b10
                lineo_company_id: 7c8f70f7-1234-5678-9abc-def012345678
                external_customer_reference: vivid-2026-01-abc123
                status: active
                created_at: "2026-04-15T09:30:12Z"
                revoked_at: null
                revocation_reason: null
                is_existing: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Connection not found or not owned by the authenticated broker.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      operationId: revokeBrokerConnection
      summary: Revoke a data-sharing connection
      description: |
        Marks the connection as `revoked` and stops all subsequent data pulls.
        Idempotent: revoking an already-revoked connection returns `200 OK` with the
        existing revocation timestamp.

        Use this when the customer revoked sharing on the broker's side, or when the
        broker administratively wants to terminate the link. Customer-initiated
        revocations from the Lineo side will produce a `connection.revoked` webhook
        instead.
      tags: [Connections]
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: reason
          in: query
          required: false
          schema:
            type: string
            enum:
              - customer_request
              - broker_admin
              - contract_terminated
              - other
            default: customer_request
          description: Why the connection is being revoked. Stored in the audit log.
      responses:
        "200":
          description: Connection revoked (or already revoked).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionResponse"
              example:
                connection_id: 5f9b1e1f-2c08-4f8e-9b3b-1c5e6d7a9b10
                lineo_company_id: 7c8f70f7-1234-5678-9abc-def012345678
                external_customer_reference: vivid-2026-01-abc123
                status: revoked
                created_at: "2026-04-15T09:30:12Z"
                revoked_at: "2026-08-01T14:22:00Z"
                revocation_reason: customer_request
                is_existing: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Connection not found or not owned by the authenticated broker.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        API key provided by Lineo during broker onboarding.
        Include this header in every request.

  schemas:
    RegisterLeadRequest:
      type: object
      required:
        - company_name
        - hrb_court
        - hrb_number
        - street
        - postal_code
        - city
        - first_name
        - last_name
        - email
      properties:
        external_customer_reference:
          type: string
          maxLength: 100
          description: >
            Optional broker-side identifier for this customer. If provided, Lineo
            persists it on the lead and, on transition to `active`, automatically
            creates a data-sharing connection so no separate
            `POST /v1/broker/connections` call is needed for lead-flow customers.

            The value is opaque to Lineo — round-tripped in `RegisterLeadResponse`,
            `LeadStatusResponse`, all webhook payloads, and used to identify the
            customer when Lineo pulls data from the broker's API.

            Brokers whose data-export API requires a per-customer reference (for
            example Vivid's `referral_code`) should always supply this field.
            Brokers without such a requirement may omit it.
          example: vivid-2026-01-abc123
        company_name:
          type: string
          maxLength: 200
          description: Registered company name.
          example: Muster GmbH
        hrb_court:
          type: string
          maxLength: 200
          description: The Handelsregister court (e.g. "Amtsgericht München").
          example: Amtsgericht München
        hrb_number:
          type: string
          maxLength: 50
          description: Handelsregister number.
          example: HRB 123456
        street:
          type: string
          maxLength: 200
          description: Street and house number of the registered office.
          example: Teststraße 1
        postal_code:
          type: string
          maxLength: 10
          pattern: '^\d{5}$'
          description: German postal code (PLZ).
          example: "10115"
        city:
          type: string
          maxLength: 100
          description: City of the registered office. Also used as the signing-place city on the contract.
          example: Berlin
        first_name:
          type: string
          maxLength: 100
          description: Representative's first name.
          example: Max
        last_name:
          type: string
          maxLength: 100
          description: Representative's last name.
          example: Mustermann
        email:
          type: string
          format: email
          maxLength: 254
          description: >
            Representative's email address. For customers without an existing tax advisor,
            Yousign will send an OTP to this email during contract signing.
          example: max.mustermann@example.de
        phone:
          type: string
          maxLength: 16
          description: "Representative's phone number (optional) in E.164 format: '+' followed by 1-15 digits, first digit non-zero."
          example: "+491701234567"
        has_existing_tax_advisor:
          type: boolean
          default: false
          description: >
            Set to `true` if the customer already has a tax advisor they want to
            continue working with. When `true`, `tax_advisor_contact` is required.
        tax_advisor_contact:
          $ref: "#/components/schemas/TaxAdvisorContact"

    TaxAdvisorContact:
      type: object
      description: >
        Contact information for the customer's existing tax advisor.
        Required when `has_existing_tax_advisor` is `true`.
      required:
        - name
        - email
      properties:
        name:
          type: string
          maxLength: 200
          description: Tax advisor company or individual name.
          example: Dr. Schmidt Steuerberatung
        email:
          type: string
          format: email
          maxLength: 254
          description: Tax advisor's email address. Lineo will send an invitation to this address.
          example: schmidt@steuerberater.de
        phone:
          type: string
          maxLength: 16
          description: "Tax advisor's phone number (optional) in E.164 format."
          example: "+491709876543"

    RegisterLeadResponse:
      type: object
      properties:
        lead_id:
          type: string
          format: uuid
          description: Unique lead identifier. Use this for status queries.
        external_customer_reference:
          type: string
          nullable: true
          description: Echoed back from the request, or `null` if the broker did not supply one.
        status:
          type: string
          enum:
            - contract_sent
            - awaiting_third_party
          description: >
            Initial status of the lead after registration.
            `contract_sent` — a signature link is available for iFrame embedding.
            `awaiting_third_party` — the tax advisor has been contacted; no signature link.
        signature_link:
          type: string
          format: uri
          nullable: true
          description: >
            Yousign signing URL. Present only when `has_existing_tax_advisor` is `false`.
            Embed this in an iFrame so the customer can review and sign the contract.
            The customer will receive an OTP via email for verification.
        signature_link_expiration_date:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO 8601 expiration timestamp for the signature link. Present only when
            `signature_link` is provided. After this time the link is no longer valid.
        is_existing:
          type: boolean
          description: >
            `true` if this response is an idempotent hit (the lead already existed
            in an active state). `false` for newly created leads.

    LeadStatusResponse:
      type: object
      properties:
        lead_id:
          type: string
          format: uuid
        external_customer_reference:
          type: string
          nullable: true
          description: Broker-side reference echoed from the registration request.
        status:
          type: string
          enum:
            - awaiting_third_party
            - contract_sent
            - contract_signed
            - active
            - rejected
            - abandoned
          description: |
            Broker-friendly lead status:

            | Status | Description |
            |--------|-------------|
            | `awaiting_third_party` | Flow B only. The customer's existing tax advisor has been contacted; awaiting their acceptance. Once they accept, the contract is generated and status moves to `contract_sent`. |
            | `contract_sent` | Initial state for Flow A; mid-flow state for Flow B. The tri-party contract has been generated and a signing link is available for iFrame embedding. |
            | `contract_signed` | The customer (for Flow A) or its own tax advisor (for Flow B) has signed the contract. The matched tax advisory partner countersignature is pending. |
            | `active` | Partner countersigned. Customer account has been provisioned and an activation email sent. Onboarding complete. If `external_customer_reference` was supplied, a data-sharing connection has been auto-created (see `connection_id`). |
            | `rejected` | Terminal failure (no partner could be matched, customer abandoned mid-signing, contract declined, etc.). |
            | `abandoned` | Lead expired (90-day timeout) without progressing to `active`. |
        assigned_partner_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the assigned tax advisory partner (set as soon as a partner is matched, before contract generation).
        partner_name:
          type: string
          nullable: true
          description: Name of the assigned tax advisory partner.
        created_at:
          type: string
          format: date-time
          description: When the lead was registered.
        contract_signed_at:
          type: string
          format: date-time
          nullable: true
          description: When the customer (for Flow A) or its own tax advisor (for Flow B) signed the contract (transition to `contract_signed`).
        activated_at:
          type: string
          format: date-time
          nullable: true
          description: When the lead became `active` (partner countersignature complete).
        connection_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Identifier of the data-sharing connection that was auto-created on transition
            to `active`. Present only when `external_customer_reference` was supplied at
            registration. `null` otherwise.

    WebhookPayload:
      type: object
      description: |
        Envelope POSTed to your configured webhook URL on lead status transitions and
        connection lifecycle events.

        **Verification:** Each request includes an `X-Webhook-Signature` header containing
        an HMAC-SHA256 hex digest computed over the raw request body using your webhook
        secret. Verify the signature before processing:

        ```
        expected = HMAC-SHA256(webhook_secret, raw_body)
        if X-Webhook-Signature != hex(expected):
            return 401
        ```

        **Delivery:** Failed deliveries are retried up to 3 times with exponential backoff.
        Delivery failures do not block the underlying state transition. Your endpoint
        should return `2xx` within 5 seconds.

        **Event types:**

        | `event_type` | Surface | Meaning |
        |---|---|---|
        | `lead.status.awaiting_third_party` | Lead | Flow B advisor contacted. |
        | `lead.status.contract_sent` | Lead | Signing link available. |
        | `lead.status.contract_signed` | Lead | Customer (for Flow A) or its own tax advisor (for Flow B) signed; partner countersignature pending. |
        | `lead.status.active` | Lead | Onboarding complete. If `connection_id` is non-null, a data-sharing connection was auto-created. |
        | `lead.status.rejected` | Lead | Terminal failure. |
        | `lead.status.abandoned` | Lead | Lead expired (90-day timeout). |
        | `connection.activated` | Connection | New data-sharing connection is active (from existing-customer flow OR auto-provisioned at lead `active`). |
        | `connection.revoked` | Connection | Existing connection was revoked (by customer in Lineo app, by broker via `DELETE`, or contractually). |
      required:
        - event_type
        - timestamp
      properties:
        event_type:
          type: string
          description: >
            Machine-readable event identifier. See table above for the full list.
          example: lead.status.contract_signed
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the underlying state transition.
        lead_id:
          type: string
          format: uuid
          nullable: true
          description: Set on all `lead.status.*` events. `null` on connection events.
        external_customer_reference:
          type: string
          nullable: true
          description: >
            Broker-side reference. Populated whenever it was supplied at lead registration
            (lead events) or when the connection was created (connection events).
        connection_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Set on `connection.*` events, and on `lead.status.active` when a connection
            was auto-provisioned from `external_customer_reference`.
        lineo_company_id:
          type: string
          format: uuid
          nullable: true
          description: Set on `connection.*` events.
        lead_status:
          type: string
          nullable: true
          enum:
            - awaiting_third_party
            - contract_sent
            - contract_signed
            - active
            - rejected
            - abandoned
          description: New lead status. Present on `lead.status.*` events.
        connection_status:
          type: string
          nullable: true
          enum:
            - active
            - revoked
          description: New connection status. Present on `connection.*` events.
        details:
          type: object
          nullable: true
          description: >
            Optional event-specific context (e.g. `revocation_reason` for
            `connection.revoked`, `rejection_reason` for `lead.status.rejected`).
      example:
        event_type: lead.status.contract_signed
        timestamp: "2026-04-13T10:15:00Z"
        lead_id: d290f1ee-6c54-4b01-90e6-d701748f0851
        external_customer_reference: vivid-2026-01-abc123
        lead_status: contract_signed

    CreateConnectionRequest:
      type: object
      required:
        - external_customer_reference
        - hrb_court
        - hrb_number
      properties:
        external_customer_reference:
          type: string
          maxLength: 100
          description: >
            Broker-side identifier for this customer grant. Lineo persists it on the
            connection and uses it to identify the customer when pulling data from the
            broker's API. Must be unique per broker.
          example: vivid-2026-01-abc123
        hrb_court:
          type: string
          maxLength: 200
          description: The Handelsregister court (e.g. "Amtsgericht München").
          example: Amtsgericht München
        hrb_number:
          type: string
          maxLength: 50
          description: Handelsregister number.
          example: HRB 123456

    ConnectionResponse:
      type: object
      properties:
        connection_id:
          type: string
          format: uuid
          description: Lineo-assigned identifier for this data-sharing connection.
        lineo_company_id:
          type: string
          format: uuid
          description: Lineo's stable identifier for the linked customer (company).
        external_customer_reference:
          type: string
          description: Broker-side identifier supplied at creation.
        status:
          type: string
          enum:
            - active
            - revoked
          description: |
            | Status | Meaning |
            |---|---|
            | `active` | Connection is live; Lineo will pull data from the broker on schedule. |
            | `revoked` | Connection has been terminated; no further data will be pulled. Terminal state. |
        created_at:
          type: string
          format: date-time
          description: When the connection was first created.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: When the connection was revoked (`null` for `active` connections).
        revocation_reason:
          type: string
          nullable: true
          enum:
            - customer_request
            - broker_admin
            - contract_terminated
            - other
          description: Reason recorded on revocation (`null` for `active` connections).
        is_existing:
          type: boolean
          description: >
            `true` if the response represents an idempotent hit (the connection already
            existed). `false` for newly created connections. Always `false` on `GET` and
            `DELETE` responses.

    ProblemDetails:
      type: object
      description: |
        Error response following [RFC 9457 — Problem Details for HTTP APIs](https://www.rfc-editor.org/rfc/rfc9457).
        Maps to the .NET `ProblemDetails` class.
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          example: https://api.lineo.finance/errors/lead-not-found
        title:
          type: string
          description: A short human-readable summary of the problem type.
          example: Lead Not Found
        status:
          type: integer
          description: The HTTP status code.
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
          example: The requested lead does not exist or is not owned by your broker account.
        instance:
          type: string
          format: uri
          description: A URI reference identifying the specific occurrence (optional).

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          description: |
            Validation error response following [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457)
            with an `errors` dictionary. Maps to the .NET `ValidationProblemDetails` class.
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: A map of field names to arrays of validation error messages.
      example:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.21
        title: One or more validation errors occurred.
        status: 422
        errors:
          email:
            - The email field is required.
            - The email field is not a valid email address.
          company_name:
            - The company_name field is required.

  responses:
    Unauthorized:
      description: Missing or invalid `X-Api-Key` header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: https://api.lineo.finance/errors/invalid-api-key
            title: Unauthorized
            status: 401
            detail: The X-Api-Key header is missing or contains an invalid key.

    ValidationError:
      description: Request body failed validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
